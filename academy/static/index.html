<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><h1>강의 목록</h1></header>
  <main class="list-page">
    <form id="tools" class="list-tools">
      <input id="search" type="search" placeholder="강의 찾기 (예: 제망매가, 고2 미래엔)" aria-label="강의 찾기">
      <button type="submit">내용에서 찾기</button>
      <label><input type="checkbox" id="guide-only"> 요점 정리 있는 것만</label>
    </form>
    <p id="found-status" class="sr-only" aria-live="polite"></p>
    <section id="found" hidden></section>
    <section id="recent" hidden><h2>이어 보기</h2><ul id="recent-list" class="video-list"></ul></section>
    <section id="new" hidden><h2>새로 올라온 강의</h2><ul id="new-list" class="video-list"></ul></section>
    <p id="empty" class="notice" hidden>아직 올라온 강의가 없습니다.</p>
    <div id="folders"></div>
  </main>
  <script src="common.js"></script>
  <script>
    const search = document.getElementById("search"), guideOnly = document.getElementById("guide-only");
    const norm = (text) => text.toLowerCase().replace(/\s+/g, "");
    // 검색어·체크·펼친 폴더는 강의를 보고 돌아와도 그대로 있도록 브라우저에 기억합니다.
    const saved = store.get("list") || {};
    search.value = saved.q || "";
    guideOnly.checked = !!saved.guideOnly;
    const opened = new Set(saved.open || []);
    const save = () => store.set("list", { q: search.value, guideOnly: guideOnly.checked, open: [...opened] });
    let folders = [];

    // 낱말마다 제목(폴더 경로 포함)에 들어 있으면 보여 줍니다. 띄어쓰기와 낱말 순서는 상관없습니다.
    function apply() {
      const words = search.value.trim().split(/\s+/).filter(Boolean).map(norm);
      let total = 0;
      for (const folder of folders) {
        let shown = 0;
        for (const item of folder.items) {
          const hit = words.every((w) => item.key.includes(w)) && (!guideOnly.checked || item.guide);
          item.li.hidden = !hit;
          shown += hit;
        }
        folder.box.hidden = !shown;
        folder.count.textContent = shown;
        folder.box.open = words.length ? true : opened.has(folder.name);  // 찾는 중에는 맞는 폴더를 모두 펼칩니다
        total += shown;
      }
      const empty = document.getElementById("empty");
      empty.textContent = folders.length ? "제목으로 찾은 강의가 없습니다." : "아직 올라온 강의가 없습니다.";
      empty.hidden = total > 0;
      save();
    }
    search.oninput = apply;
    guideOnly.onchange = apply;

    function lectureLink(v, label) {
      const pos = store.get(`pos:${v.id}`);
      const watched = !pos ? "" : pos.t >= pos.d - 5 ? "다 봄" : `${fmt(pos.t)}까지 봄`;
      return el("a", { href: `watch.html?id=${v.id}` },
        el("span", { class: "video-title" }, label),
        el("span", { class: "meta" },
          el("span", { class: v.analyzed ? "badge ready" : "badge" },
            v.guide ? "요점 정리" : v.toc ? "목차" : v.analyzed ? "페이지" : "분석 전"),
          watched));
    }

    // 내용에서 찾기: 선생님이 그 낱말을 말한 강의와 시각(받아쓰기 대본에서 찾음)
    document.getElementById("tools").onsubmit = async (e) => {
      e.preventDefault();
      const q = search.value.trim(), box = document.getElementById("found");
      box.hidden = false;
      box.replaceChildren(el("p", { class: "notice" }, "찾는 중…"));
      const status = document.getElementById("found-status");  // 결과 전체 대신 수만 화면 읽기 프로그램에 알립니다
      status.textContent = "찾는 중";
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const found = await res.json().catch(() => ({}));
      if (!res.ok) {
        box.replaceChildren(el("p", { class: "notice" }, found.detail || "찾지 못했습니다."));
        status.textContent = found.detail || "찾지 못했습니다.";
        return;
      }
      status.textContent = `강의 ${found.exact.length}개, 비슷한 말 ${found.similar.length}개, 학원 정리·목차 ${found.notes.length}개 찾음`;
      // 묶음마다 30개씩 보여 주고 '더 보기'로 이어서 보여 줍니다.
      const paged = (list, item) => {
        const ul = el("ul", { class: "found-list" }), more = el("button", { type: "button", class: "more" });
        let shown = 0;
        const step = () => {
          ul.append(...list.slice(shown, shown + 30).map(item));
          shown += 30;
          more.hidden = shown >= list.length;
          more.textContent = `더 보기 (남은 강의 ${list.length - shown}개)`;
        };
        more.onclick = step;
        step();
        return [ul, more];
      };
      const spoken = (r) => el("li", {},
        el("a", { href: `watch.html?id=${r.id}` }, r.title), " ",
        ...r.times.flatMap((t, i) => [el("a", { class: "time", href: `watch.html?id=${r.id}&t=${Math.floor(t)}` },
          fmt(t), ...(r.chapters[i] ? [` · ${r.chapters[i]}`] : [])), " "]),
        el("span", { class: "meta" }, `${r.count}번`),
        ...(r.heard_as ? [el("p", { class: "also" }, `받아 적힌 말: ${r.heard_as.map((w) => `‘${w}’`).join(", ")}`)] : []),
        ...(r.also.length ? [el("p", { class: "also" }, `같은 녹화: ${r.also.join(", ")}`)] : []));
      const noted = (r) => el("li", {},
        el("a", { href: `watch.html?id=${r.id}` }, r.title), " ",
        ...r.matches.flatMap((m) => m.time == null
          ? [el("p", { class: "also" }, m.text)]
          : [el("a", { class: "time", href: `watch.html?id=${r.id}&t=${Math.floor(m.time)}` }, `${fmt(m.time)} · ${m.text}`), " "]),
        ...(r.also.length ? [el("p", { class: "also" }, `같은 녹화: ${r.also.join(", ")}`)] : []));
      box.replaceChildren(
        el("h2", {}, `‘${q}’ 내용 검색: 강의 ${found.exact.length}개 (많이 말한 순)`),
        el("p", { class: "notice" }, "선생님 말을 받아 적은 글에서 찾습니다. 시각을 누르면 그 장면부터 봅니다."),
        ...paged(found.exact, spoken),
        ...(found.similar.length ? [
          el("h2", {}, `비슷한 말로 받아 적힌 강의 ${found.similar.length}개`),
          el("p", { class: "notice" }, "받아쓰기가 소리 하나를 다르게 적은 곳입니다. 다른 낱말일 수도 있으니 적힌 말을 확인하세요."),
          ...paged(found.similar, spoken)] : []),
        ...(found.notes.length ? [
          el("h2", {}, `학원 정리·목차에 나오는 강의 ${found.notes.length}개`),
          el("p", { class: "notice" }, "선생님 말에서는 찾지 못했지만 학원 요점 정리나 목차에 적혀 있는 강의입니다."),
          ...paged(found.notes, noted)] : []));
    };

    fetch("/api/videos").then((r) => r.json()).then((videos) => {
      // 이어 보기: 다 보지 않은 강의를 최근에 본 순서로 5개
      const recent = videos.map((v) => ({ v, pos: store.get(`pos:${v.id}`) }))
        .filter(({ pos }) => pos && pos.t > 5 && pos.t < pos.d - 5)
        .sort((a, b) => (b.pos.at || 0) - (a.pos.at || 0)).slice(0, 5);
      document.getElementById("recent-list").replaceChildren(...recent.map(({ v }) => el("li", {}, lectureLink(v, v.title))));
      document.getElementById("recent").hidden = !recent.length;
      // 새로 올라온 강의: 최근 14일 안에 NAS에 올라온 강의를 최신순으로 10개
      const fresh = videos.filter((v) => v.added > Date.now() / 1000 - 14 * 86400).sort((a, b) => b.added - a.added).slice(0, 10);
      const day = (seconds) => new Date(seconds * 1000).toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
      document.getElementById("new-list").replaceChildren(...fresh.map((v) => el("li", {}, lectureLink(v, `${v.title} · ${day(v.added)}`))));
      document.getElementById("new").hidden = !fresh.length;
      const byFolder = new Map();
      for (const v of videos) {
        const cut = v.title.indexOf("/");
        const name = cut < 0 ? "기타" : v.title.slice(0, cut);
        if (!byFolder.has(name)) byFolder.set(name, []);
        byFolder.get(name).push({ v, rest: v.title.slice(cut + 1) });
      }
      folders = [...byFolder].map(([name, list]) => {
        const count = el("span", { class: "count" });
        // 이 브라우저에서 보기 시작한 강의 수(시청 위치가 저장된 강의)
        const seen = list.filter(({ v }) => (store.get(`pos:${v.id}`)?.t || 0) > 5).length;
        const ul = el("ul", { class: "video-list" });
        const box = el("details", { class: "folder" },
          el("summary", {}, name, count, ...(seen ? [el("span", { class: "count" }, `· ${seen}개 봄`)] : [])), ul);
        box.ontoggle = () => {
          if (search.value.trim()) return;  // 찾는 중에 자동으로 펼친 것은 기억하지 않습니다
          if (box.open) opened.add(name); else opened.delete(name);
          save();
        };
        const items = list.map(({ v, rest }) => {
          const li = el("li", {}, lectureLink(v, rest));
          ul.append(li);
          return { li, key: norm(v.title), guide: v.guide };
        });
        document.getElementById("folders").append(box);
        return { name, box, count, items };
      });
      apply();
    });
  </script>
</body>
</html>
