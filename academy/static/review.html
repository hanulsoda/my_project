<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>틀린 문제 복습</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="학습 플레이어">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="top"><a class="back" href="./">‹ 강의 목록</a><h1>틀린 문제 복습</h1></header>
  <main id="review" class="list-page"><p class="notice">불러오는 중…</p></main>
  <script src="common.js"></script>
  <script>
    // 모든 강의 퀴즈에서 틀리거나 '몰랐어요'를 누른 문제를 모아 다시 풉니다. 맞히거나 '알았어요'를 누르면 기록에서 빠집니다.
    const box = document.getElementById("review");
    const say = (text) => box.replaceChildren(el("p", { class: "notice" }, text));
    (async () => {
      const lists = wrongLists();
      if (!lists.length) return say("복습할 틀린 문제가 없습니다. 강의 퀴즈에서 틀리거나 '몰랐어요'를 누른 문제가 여기에 모입니다.");
      const sections = [];
      let failed = false;
      for (const w of lists) {
        const res = await fetch(`/api/videos/${w.id}`);
        if (!res.ok) { failed = true; continue; }  // 지워진 강의이거나 서버 오류: 기록은 두고 이번엔 건너뜁니다
        const lecture = await res.json();
        const quiz = lecture.analysis?.guide?.quiz || (lecture.references || []).flatMap((r) => r.quiz);
        const shown = quiz.filter((q) => w.keys.includes(quizKey(q)));
        if (!shown.length) continue;
        const replay = (q) => q.time == null ? null
          : el("a", { class: "link", href: `watch.html?id=${w.id}&t=${Math.floor(q.time)}` }, `▶ ${fmt(q.time)} 설명 다시 보기`);
        sections.push(el("section", { class: "review-lecture" },
          el("h2", {}, el("a", { href: `watch.html?id=${w.id}` }, lecture.title)),
          ...shown.map((q) => quizCard(q, quiz.indexOf(q) + 1, (right) => markWrong(w.id, quizKey(q), !right), replay))));
      }
      const trouble = "일부 강의를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.";
      if (!sections.length) return say(failed ? trouble : "복습할 틀린 문제가 없습니다.");
      box.replaceChildren(...(failed ? [el("p", { class: "notice" }, trouble)] : []),
        el("p", { class: "notice" }, "다시 맞히거나 '알았어요'를 누르면 목록에서 빠집니다. 문제 번호는 강의 퀴즈의 번호입니다."), ...sections);
    })();
  </script>
</body>
</html>
