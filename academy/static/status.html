<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 현황</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="학습 플레이어">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
</head>
<body class="library" data-view="page">
  <div class="app">
    <header class="content-head"><a class="back" href="./">강의</a><div class="heading"><h1>강의 현황</h1><p id="view-sub" class="sub"></p></div></header>
    <nav class="sidebar" aria-label="보관함과 폴더"></nav>
    <main class="content-body"><div class="list-page">
    <p class="notice">강의마다 학생이 받는 것을 셉니다. 한 강의는 Claude 요점 정리 → 학원 정리 → 자동 목차 → 페이지만 순서로 하나에만 셉니다.</p>
    <dl id="counts" class="stats"><dt>불러오는 중…</dt><dd></dd></dl>
    <h2>자동 목차 진행</h2>
    <p id="toc" class="notice"></p>
    <progress id="toc-bar" max="1" value="0" aria-label="자동 목차 진행률"></progress>
    <section id="usage" hidden>
      <h2>이용 통계 (최근 30일)</h2>
      <p id="usage-summary" class="notice"></p>
      <ol id="usage-top" class="plain"></ol>
      <h3 class="usage-week-title">요일별 강의 열기 (최근 4주)</h3>
      <div id="usage-week" class="bars usage-bars"></div>
      <p class="notice">학생 이름과 기기 주소는 남기지 않습니다. 플레이어에서 강의를 연 시각과, 기기를 알아볼 수 없게 바꾼 번호만 셉니다.</p>
    </section>
    <section id="ops" hidden>
      <h2>운영 기록</h2>
      <dl id="ops-lines" class="stats"></dl>
    </section>
    <h2>분석되지 않은 강의</h2>
    <ul id="unanalyzed" class="plain"></ul>
    </div></main>
  </div>
  <script src="common.js"></script>
  <script>
    fetch("/api/videos").then((r) => (r.ok ? r.json() : [])).catch(() => []).then((videos) => fillSidebar(videos, { here: "" }));
    fetch("/api/status").then((r) => r.json()).then((s) => {
      const rows = [["전체 강의", s.total], ["분석 끝남", s.analyzed], ["Claude 요점 정리", s.guide], ["학원 정리", s.summary],
                    ["자동 목차", s.toc], ["페이지만", s.pages], ["분석 안 됨", s.total - s.analyzed]];
      document.getElementById("counts").replaceChildren(...rows.flatMap(([name, n]) => [el("dt", {}, name), el("dd", {}, n.toLocaleString())]));
      // 쓸 수 없는 답이 나와 빈 목차로 남긴 강의도 처리한 것으로 셉니다.
      const { target, done, last_3_days: recent } = s.toc_progress;
      // 최근 3일 속도로 남은 날을 어림합니다. 밤 작업 마지막 기록이 '…멈춥니다'(팬·NAS 문제로 멈춤)면 어림하지 않습니다.
      // 매일 아침의 정상 종료 기록은 '멈춤'이라 여기에 걸리지 않습니다.
      const pace = s.ops?.night?.includes("멈춥니다") ? "지금은 밤 작업이 멈춰 있습니다(아래 운영 기록 참고)."
        : recent ? `최근 3일 동안 ${recent.toLocaleString()}개(하루 약 ${Math.round(recent / 3)}개) 만들어, 이대로면 약 ${Math.ceil((target - done) / (recent / 3))}일 더 걸립니다.`
        : "최근 3일 동안 만든 목차가 없습니다(밤 작업이 멈춰 있을 수 있습니다).";
      document.getElementById("toc").textContent = `대상(Claude 요점 정리가 없는 강의) ${target.toLocaleString()}개 중 `
        + `${done.toLocaleString()}개 처리 (${target ? Math.floor(done / target * 100) : 100}%), 남은 강의 ${(target - done).toLocaleString()}개. ${pace}`;
      const bar = document.getElementById("toc-bar");
      bar.max = target || 1;
      bar.value = done;
      if (s.ops) {  // 서버에 로그 폴더(LOG_DIR)를 알려 준 경우에만 옵니다
        const lines = [["마지막 백업", s.ops.backup], ["밤 작업", s.ops.night], ["새 강의 분석", s.ops.new_videos]];
        document.getElementById("ops-lines").replaceChildren(...lines.flatMap(([name, line]) => [el("dt", {}, name), el("dd", {}, line || "기록 없음")]));
        document.getElementById("ops").hidden = false;
      }
      if (s.usage) {  // 이용 통계: 많이 연 강의 10개(기기 수 순)와 요일별 열기
        const u = s.usage, day = (iso) => new Date(`${iso}T00:00`).toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
        document.getElementById("usage-summary").textContent = u.since
          ? `강의를 연 횟수 ${u.opens.toLocaleString()}번 · 기기 ${u.devices.toLocaleString()}대 · ${day(u.since)}부터 기록`
          : "아직 기록이 없습니다. 학생이 플레이어에서 강의를 열면 그때부터 셉니다.";
        document.getElementById("usage-top").replaceChildren(...u.top.map((t) => el("li", {},
          el("a", { href: `watch.html?id=${t.id}` }, t.title), ` · 기기 ${t.devices}대 · ${t.opens}번`)));
        const top = Math.max(1, ...u.weekdays);
        document.getElementById("usage-week").replaceChildren(...u.weekdays.map((n, i) => el("span", { class: "day" },
          el("span", { class: "bar", "aria-hidden": "true" }, el("span", { style: `height: ${Math.round((n / top) * 100)}%` })),
          el("span", { class: "label", "aria-hidden": "true" }, "월화수목금토일"[i]),
          el("span", { class: "sr-only" }, `${"월화수목금토일"[i]}요일 ${n}번`))));
        document.getElementById("usage").hidden = false;
      }
      document.getElementById("unanalyzed").replaceChildren(...(s.unanalyzed.length
        ? s.unanalyzed.map((title) => el("li", {}, title)) : [el("li", { class: "notice" }, "없습니다.")]));
    });
  </script>
</body>
</html>
