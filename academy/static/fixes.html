<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학원 정리 고치기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="학습 플레이어">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
</head>
<body class="library" data-view="page">
  <main class="app">
    <header class="content-head"><a class="back" href="./">강의</a>
      <div class="heading"><h1>학원 정리 고치기</h1><p id="view-sub" class="sub"></p></div>
      <form class="tools" role="search" onsubmit="return false">
        <input id="ref-search" type="search" aria-label="정리 찾기" placeholder="작품 찾기 (예: 홍계월전)">
        <label class="switch-label"><input type="checkbox" id="suspect-only" class="switch" role="switch" checked> 의심 항목 있는 것만</label>
      </form>
    </header>
    <nav class="sidebar" aria-label="보관함과 폴더"></nav>
    <div class="content-body"><div class="list-page">
      <p class="notice">학생이 요점 정리 탭에서 보는 학원 정리를 항목마다 고치거나 숨깁니다. 원본 정리 파일은 그대로 두고 고친 글과 숨긴 항목만 따로 저장해, 학생 화면에 바로 반영합니다. 고치려면 선생님 열쇠가 필요합니다(이 브라우저에 기억).
        빈칸 문제는 퀴즈로 나가며 숨기기만 됩니다. 한 정리의 요점 항목을 모두 숨기면 그 정리는 빈칸 문제까지 학생에게 나가지 않습니다.</p>
      <form id="key-form" class="note-form" hidden>
        <input id="teacher-key" type="password" autocomplete="off" aria-label="선생님 열쇠" placeholder="선생님 열쇠">
        <button type="submit">열쇠 넣기</button>
      </form>
      <p id="fix-status" class="notice" aria-live="polite"></p>
      <ul id="ref-list" class="found-list"></ul>
      <section id="ref-detail" hidden></section>
    </div></div>
  </main>
  <script src="common.js"></script>
  <script>
    // 학원 정리 고치기(선생님용, 학생 사이드바에는 없음): 정리를 찾아 항목마다 고치기·숨기기·원래대로.
    // 의심 항목(너무 긴 항목, 한 단계에 내용이 몰림)은 표시해 둡니다. 저장은 X-Teacher-Key가 맞아야 됩니다.
    const $ = (elementId) => document.getElementById(elementId);
    let refs = [];
    const say = (text) => { $("fix-status").textContent = text; };
    const flat = (text) => text.toLowerCase().replace(/\s+/g, "");  // 찾을 때 띄어쓰기는 보지 않습니다('운수좋은날')
    fetch("/api/videos").then((r) => (r.ok ? r.json() : [])).catch(() => []).then((videos) => fillSidebar(videos, { here: "" }));

    // 열쇠 칸은 저장을 누른 항목 바로 아래로 옮겨 보여 줍니다(휴대폰에서 맨 위까지 올라가지 않게). 항목을 다시 그리기 전에 제자리로.
    const tell = (card, text) => { card.querySelector(".fix-msg").textContent = text; };
    const keyHome = () => $("fix-status").before($("key-form"));
    function askKey(card, text) {
      card.append($("key-form"));
      $("key-form").hidden = false;
      tell(card, text);
      $("teacher-key").focus();
    }
    $("key-form").onsubmit = (e) => {
      e.preventDefault();
      const key = $("teacher-key").value.trim(), card = $("key-form").closest(".fix-item");
      const answer = (text) => (card ? tell(card, text) : say(text));
      if (!key) return;
      if (!keyLooksOk(key)) return answer(KEY_HINT);
      store.set("teacher-key", key);
      $("teacher-key").value = "";
      $("key-form").hidden = true;
      answer("열쇠를 넣었습니다. 다시 저장해 주세요.");
    };

    function renderList() {
      const words = $("ref-search").value.split(/\s+/).filter(Boolean).map(flat);
      const shown = refs.filter((r) => (!$("suspect-only").checked || r.suspects)
                                       && words.every((w) => flat(`${r.grade} ${r.title}`).includes(w)));
      const flagged = refs.filter((r) => r.suspects).length;
      $("view-sub").textContent = `학원 정리 ${refs.length.toLocaleString()}개 · 의심 항목 있는 정리 ${flagged.toLocaleString()}개`;
      $("ref-list").replaceChildren(...shown.slice(0, 50).map((r) => el("li", {},
        el("button", { type: "button", class: "link", onclick: () => openRef(r.key) }, `${r.grade} · ${r.title}`),
        ...(r.suspects ? [" ", el("span", { class: "chip warn" }, `의심 ${r.suspects}`)] : []))));
      if (shown.length > 50) $("ref-list").append(el("li", { class: "notice" }, `${shown.length.toLocaleString()}개 중 50개만 보입니다. 작품 이름으로 찾아 주세요.`));
      if (!shown.length) $("ref-list").append(el("li", { class: "notice" }, "찾은 정리가 없습니다."));
    }
    $("ref-search").oninput = renderList;
    $("suspect-only").onchange = renderList;

    async function openRef(key) {
      const res = await fetch(`/api/references/${key}`);
      if (!res.ok) return say("정리를 불러오지 못했습니다.");
      renderDetail(await res.json());
    }

    // 저장하면 그 항목만 다시 그립니다: 다른 항목에 쓰다 만 글이 지워지지 않게.
    async function save(key, body, card) {
      if (!teacherKey()) return askKey(card, "고치려면 선생님 열쇠가 필요합니다. 열쇠를 넣어 주세요.");
      const res = await fetch(`/api/references/${key}/fix`, {
        method: "PUT", headers: { "Content-Type": "application/json", "X-Teacher-Key": teacherKey() }, body: JSON.stringify(body) });
      if (res.status === 429) return tell(card, "열쇠를 여러 번 틀려 10분 동안 막혔습니다. 잠시 뒤 다시 해 주세요.");
      if (res.status === 403) {
        localStorage.removeItem("teacher-key");
        return askKey(card, "선생님 열쇠가 맞지 않습니다. 다시 넣어 주세요.");
      }
      if (!res.ok) return tell(card, "저장하지 못했습니다. 잠시 뒤 다시 해 주세요.");
      const ref = await res.json(), all = ref.sections.flatMap((s) => s.items);
      const listed = refs.find((r) => r.key === key);  // 목록의 의심 수: 고치거나 숨긴 항목은 빼고
      if (listed) listed.suspects = all.filter((it) => it.suspect && it.text === it.original && !it.hidden).length;
      const it = ref.sections.find((s) => s.name === body.section).items.find((i) => i.original === body.original);
      if (card.contains($("key-form"))) keyHome();
      const fresh = itemCard(key, body.section, it);
      card.replaceWith(fresh);
      tell(fresh, "저장했습니다. 학생 화면에 바로 나옵니다.");
      fresh.querySelector("button").focus({ preventScroll: true });  // 키보드로 저장했으면 같은 자리에서 이어서
    }

    function itemCard(key, section, it) {
      // 빈칸 문제는 퀴즈로 나갑니다. 빈칸 표시(두 칸 띄어쓰기)가 깨지기 쉬워 글은 고치지 않고 숨기기만 합니다.
      const fill = section === "빈칸 문제";
      const area = fill ? el("p", {}, it.text)
        : el("textarea", { rows: String(Math.min(8, Math.ceil(it.text.length / 45) + 1)), "aria-label": `${section} 항목 고치기` });
      if (!fill) area.value = it.text;
      const changed = it.text !== it.original;
      const card = el("article", { class: it.hidden ? "fix-item hidden-item" : "fix-item" },
        el("p", { class: "fix-flags" }, ...(it.suspect ? [el("span", { class: "chip warn" }, it.suspect)] : []),
          ...(changed ? [el("span", { class: "chip" }, "고침")] : []), ...(it.hidden ? [el("span", { class: "chip" }, "숨김")] : [])),
        area,
        ...(changed ? [el("p", { class: "fix-original" }, `원래 글: ${it.original}`)] : []),
        el("div", { class: "quiz-actions" },
          ...(fill ? [] : [el("button", { type: "button", class: "retry",
            onclick: () => save(key, { section, original: it.original, text: area.value }, card) }, "저장")]),
          el("button", { type: "button", class: "more", onclick: () => save(key, { section, original: it.original, hidden: !it.hidden }, card) },
            it.hidden ? "다시 보이기" : "숨기기"),
          ...(!fill && (changed || it.hidden) ? [el("button", { type: "button", class: "more",
            onclick: () => save(key, { section, original: it.original, text: it.original, hidden: false }, card) }, "원래대로")] : [])),
        el("p", { class: "notice fix-msg", "aria-live": "polite" }));
      return card;
    }

    function renderDetail(ref) {
      keyHome();
      $("ref-list").hidden = true;
      $("ref-detail").hidden = false;
      $("ref-detail").replaceChildren(
        el("button", { type: "button", class: "more", onclick: () => { keyHome(); $("ref-detail").hidden = true; $("ref-list").hidden = false; renderList(); } },
          "‹ 정리 목록"),
        el("h2", {}, `${ref.grade} 「${ref.title}」`),
        ...ref.sections.flatMap((s) => [el("h3", {}, s.name), ...s.items.map((it) => itemCard(ref.key, s.name, it))]));
    }

    fetch("/api/references").then((r) => r.json()).then((list) => { refs = list; renderList(); });
  </script>
</body>
</html>
