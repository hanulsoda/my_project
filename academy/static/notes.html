<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 메모</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="학습 플레이어">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
</head>
<body class="library" data-view="page">
  <main class="app">
    <header class="content-head"><a class="back" href="./">강의</a><div class="heading"><h1>내 메모</h1><p id="view-sub" class="sub"></p></div></header>
    <nav class="sidebar" aria-label="보관함과 폴더"></nav>
    <div class="content-body"><div id="notes-page" class="list-page"><p class="notice">불러오는 중…</p></div></div>
  </main>
  <script src="common.js"></script>
  <script>
    // 강의마다 notes:<영상 번호>에 저장된 메모·북마크를 강의별로 모아 봅니다. 시간을 누르면 그 장면부터 봅니다.
    const box = document.getElementById("notes-page");
    let titles = new Map(), videos = [], listFailed = false;  // listFailed: 강의 목록을 받지 못함(서버를 다시 켜는 중 등)

    function render() {
      const lists = savedLists("notes:");
      fillSidebar(videos, { here: "notes.html" });  // 지우면 사이드바의 메모 수도 바뀝니다
      document.getElementById("view-sub").textContent = lists.length ? `강의 ${lists.length}개 · 메모 ${lists.reduce((n, l) => n + l.items.length, 0)}개` : "";
      if (!lists.length) {
        box.replaceChildren(el("p", { class: "notice" }, "아직 메모가 없습니다. 강의를 보다가 메모 탭에서 기억할 장면을 추가하세요."));
        return;
      }
      // 지워졌거나 옮겨진 강의의 메모도 버리지 않고 보여 줍니다. 목록을 못 받았으면 이름만 모르고 강의로는 갈 수 있습니다.
      const name = (id) => titles.get(id) || (listFailed ? "강의 이름을 불러오지 못함" : "목록에 없는 강의");
      lists.sort((a, b) => name(a.id).localeCompare(name(b.id), "ko"));
      box.replaceChildren(...(listFailed ? [el("p", { class: "notice" }, `강의 이름을 불러오지 못했습니다. ${OFFLINE}`)] : []),
        ...lists.map(({ id, items }) => el("section", { class: "review-lecture", "data-id": id },
        el("h2", {}, titles.has(id) || listFailed ? el("a", { href: `watch.html?id=${id}` }, name(id)) : name(id)),
        el("ul", { class: "notes" }, ...items.map((n, i) => el("li", {},
          el("a", { class: "time", href: `watch.html?id=${id}&t=${Math.floor(n.t)}` }, fmt(n.t)),
          el("span", { class: "note-text" }, n.text || "🔖 북마크"),
          el("button", {
            class: "delete",
            "aria-label": `${fmt(n.t)} 메모 삭제`,
            onclick: () => {
              removeNote(id, n);
              render();
              // 키보드로 지웠을 때 초점이 화면 맨 처음으로 가지 않게 같은 자리의 다음 삭제 버튼으로
              const left = box.querySelectorAll(`section[data-id="${id}"] button.delete`);
              left[Math.min(i, left.length - 1)]?.focus();
            },
          }, "삭제")))))));
    }
    // 다른 탭(플레이어 등)에서 메모를 더하거나 지우면 이 화면도 바로 다시 그립니다.
    addEventListener("storage", (e) => { if (e.key === null || e.key.startsWith("notes:")) render(); });

    fetch("/api/videos").then((r) => (r.ok ? r.json() : Promise.reject())).catch(() => { listFailed = true; return []; })
      .then((list) => { videos = list; titles = new Map(videos.map((v) => [v.id, v.title])); render(); });
  </script>
</body>
</html>
