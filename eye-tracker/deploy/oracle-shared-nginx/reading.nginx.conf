# Appended to the existing nginx default.conf (do NOT replace that file).
# reading.dahim.kr -> dahim-reading:3000 (eye-tracker). Certificate comes from the same
# certbot folder the other sites use (live/reading.dahim.kr/).
#
# The upstream name is resolved at request time through a variable, so nginx still starts and
# reloads if the dahim-reading container is stopped. Without this, a missing container would
# make `nginx -t` fail and could take every other site down on the next reload.
server {
    listen 443 ssl;
    http2 on;
    server_name reading.dahim.kr;

    ssl_certificate /etc/letsencrypt/live/reading.dahim.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reading.dahim.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # The reading upload route accepts up to 10 MB of gaze samples.
    client_max_body_size 12m;

    # The reading and accuracy pages need the camera: allow it for this site only.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $reading_up http://dahim-reading:3000;

    # /sso?t=<one-time entry token>: keep the token out of the access log.
    location = /sso {
        access_log off;
        proxy_pass $reading_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $reading_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
