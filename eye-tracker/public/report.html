<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>읽기 리포트</title>
<link rel="stylesheet" href="/css/app.css">
<style>
@page { size: A4; margin: 14mm; }
@media print {
  .no-print, button { display: none !important; }
  html, body { background: #fff; font-size: 10pt; }
  main { max-width: none; padding: 0; }
  h1 { font-size: 16pt; }
  h2 { font-size: 11pt; }
  .card { border: 1px solid #999; border-radius: 0; margin: 0 0 5mm; padding: 3mm; break-inside: avoid; page-break-inside: avoid; }
  .metric-grid { grid-template-columns: repeat(3, 1fr); gap: 2mm; }
  .metric { padding: 2mm; }
  .metric .v { font-size: 14pt; }
  .chart { max-width: 120mm; max-height: 48mm; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<main class="report">
  <p id="status" role="status">불러오는 중…</p>

  <div id="content" hidden>
    <section class="card">
      <div class="row spread">
        <div>
          <h1>읽기 리포트</h1>
          <p id="who" class="muted"></p>
        </div>
        <div class="row">
          <span id="ref-badge" class="badge warn" hidden>참고용</span>
          <button id="print" type="button" class="no-print">인쇄 / PDF로 저장</button>
        </div>
      </div>
      <p id="ref-note" class="muted" hidden>이번 측정은 시선 추정 정확도가 낮아 결과를 참고용으로만 보여 드립니다. 읽기 속도와 끝까지 읽었는지는 판단하지 않습니다.</p>
      <p id="disclaimer" class="disclaimer">선별 지표이며 진단이 아닙니다.</p>
    </section>

    <section class="card">
      <h2>이번 측정</h2>
      <p id="fail-banner" class="banner" role="alert" hidden></p>
      <div id="metrics" class="metric-grid"></div>
    </section>

    <section class="card">
      <h2>기준 지문 읽기 속도 추이</h2>
      <p class="muted">같은 기준 지문을 읽은 기록만 비교합니다. 속이 빈 점은 참고용 기록입니다.</p>
      <div id="trend"></div>
    </section>
  </div>

  <div id="error" class="card" hidden>
    <h1 id="error-title"></h1>
    <p id="error-text" class="muted"></p>
  </div>
</main>
<script src="/js/dom.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/metrics-view.js"></script>
<script src="/js/report.js"></script>
</body>
</html>
