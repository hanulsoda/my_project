<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 읽기 시선 기록</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="card" style="max-width:420px;margin:48px auto">
    <h1>읽기 시선 기록</h1>
    <p class="muted">선생님 계정으로 로그인하세요. 계정은 관리자가 초대합니다.</p>
    <form id="login" class="row" style="flex-direction:column;align-items:stretch">
      <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
      <p id="msg" class="error" role="alert" hidden></p>
    </form>
  </div>
</main>
<script src="/js/dom.js"></script>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
